<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>唱片架 — Record Shelf</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --fg:#fff;
  --cover:300px;
  --ink:244,238,227;   /* 內頁只有一種墨，其餘靠濃度 */
  --sheet:11,11,11;    /* 手機抽屜底色，隨曲目由 JS 覆寫 */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}   /* flex/grid 會蓋過 hidden 屬性 */
:focus-visible{outline:2px solid #F4EEE3;outline-offset:3px}
.vol-slider:focus-visible,
.dock-item:focus-visible{outline:2px solid #F4EEE3;outline-offset:4px}
html,body{height:100%}
body{
  font-family:'Inter','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  background:#262626;
  color:var(--fg);
  overflow:hidden;
  transition:background-color .7s ease;
  user-select:none;
}
/* ---------- header ---------- */
.header{
  position:fixed;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:22px 28px;z-index:40;
  pointer-events:none;
}
.header a{pointer-events:auto}
.logo{
  font-weight:800;font-style:italic;font-size:20px;letter-spacing:.02em;
  color:var(--fg);text-decoration:none;
}
.intro-link{
  font-size:12px;letter-spacing:.08em;color:var(--fg);text-decoration:none;
  opacity:.7;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.35);
  transition:opacity .2s ease;
}
.intro-link:hover{opacity:1}
.logo span{font-style:normal;font-weight:500;opacity:.55;font-size:12px;margin-left:8px;letter-spacing:.14em}
/* ---------- stage ---------- */
.stage{
  position:fixed;inset:0;
  display:grid;
  grid-template-columns:auto auto;
  align-content:center;justify-content:center;align-items:center;
  column-gap:clamp(40px,6vw,104px);
  padding:0 clamp(20px,4vw,56px) 110px;
}
.player-col{
  display:flex;flex-direction:column;align-items:center;
  gap:18px;
}
.spotify-button{
  display:inline-flex;align-items:center;gap:8px;
  background:#fff;color:#111;text-decoration:none;
  font-size:13px;font-weight:600;
  padding:8px 16px;border-radius:99px;
  transition:transform .18s ease;
}
.spotify-button:hover{transform:scale(1.05)}
.spotify-button svg{width:16px;height:16px;flex:none}
/* ---------- cd case ---------- */
.cd-case{position:relative;width:var(--cover);height:var(--cover)}
.cd{
  position:absolute;top:50%;left:0;
  width:calc(var(--cover) * .94);height:calc(var(--cover) * .94);
  transform:translate(-52px,-50%) rotate(-38deg);
  transition:transform .6s cubic-bezier(.34,1.4,.4,1);
  z-index:1;
  border-radius:50%;
  background:
    radial-gradient(circle at center, #777 0 6.5%, #dcdcdc 7% 16%, transparent 16.5% 17%, rgba(255,255,255,.16) 17.5% 19%, transparent 19.5%),
    conic-gradient(from 90deg, #cfd6dd, #e7c7f2 12%, #c9e6f5 25%, #f3e3c0 38%, #cfd6dd 50%, #d9c9f0 62%, #c4ecda 75%, #f0d3cd 88%, #cfd6dd);
  box-shadow:0 4px 18px rgba(0,0,0,.35);
}
.cd::after{ /* center hole */
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at center, var(--hole,#262626) 0 5.4%, transparent 6%);
  transition:--hole .7s;
}
body.playing .cd{
  transform:translate(-118px,-50%) rotate(0deg);
  animation:spin 3.2s linear infinite;
}
@keyframes spin{to{transform:translate(-118px,-50%) rotate(360deg)}}
.cover-stack{position:absolute;inset:0;z-index:2}
.cover{
  position:absolute;inset:0;
  opacity:0;pointer-events:none;
  transition:transform .55s cubic-bezier(.3,1.2,.35,1),opacity .4s ease;
  transform:translateY(26px) rotate(4deg) scale(.94);
}
.cover.active{opacity:1;pointer-events:auto;transform:none;z-index:3}
.cover.leaving-up{opacity:0;transform:translateY(-34px) rotate(-5deg) scale(.96)}
.cover.leaving-down{opacity:0;transform:translateY(34px) rotate(5deg) scale(.96)}
.cover.entering-up{transform:translateY(-26px) rotate(-4deg) scale(.94)}
.cover img{
  width:100%;height:100%;object-fit:cover;display:block;
  box-shadow:0 14px 40px rgba(0,0,0,.45);
}
.cover .sheen{ /* jewel-case gloss */
  position:absolute;inset:0;
  border:1px solid rgba(255,255,255,.35);
  background:linear-gradient(118deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 26%, rgba(255,255,255,0) 74%, rgba(255,255,255,.10) 100%);
  pointer-events:none;
}
/* ---------- media data ---------- */
.media-data{text-align:center;min-height:74px}
.artist-group{
  display:flex;justify-content:center;align-items:baseline;gap:10px;
  font-size:14px;font-weight:700;letter-spacing:.01em;
}
.artist-group .collab{opacity:.6;font-weight:500}
.album-title{
  margin-top:4px;
  font-size:clamp(20px,4.4vw,34px);
  font-weight:800;line-height:1.12;
  max-width:min(88vw,560px);
}
.album-meta{
  margin-top:6px;
  font-size:11px;letter-spacing:.08em;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  opacity:.55;
}
/* ---------- player ---------- */
.media-player{display:flex;align-items:center;gap:14px;margin-top:2px}
.media-button{
  width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(255,255,255,.5);
  background:transparent;color:var(--fg);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:transform .15s ease, background .2s ease;
}
.media-button:hover{transform:scale(1.1);background:rgba(255,255,255,.12)}
.media-button:active{transform:scale(.95)}
.media-button svg{width:16px;height:16px;fill:currentColor}
.media-button.play-toggle{width:54px;height:54px;background:#fff;color:#111;border:none}
.media-button.play-toggle:hover{background:#fff;transform:scale(1.08)}
.media-button .icon-pause{display:none}
body.playing .icon-play{display:none}
body.playing .icon-pause{display:block}
/* volume */
.volume-group{display:flex;align-items:center;gap:8px}
.vol-btn{width:36px;height:36px}
.vol-btn svg{width:14px;height:14px}
.vol-btn .icon-muted{display:none}
body.muted .vol-btn .icon-vol{display:none}
body.muted .vol-btn .icon-muted{display:block}
.vol-slider{
  -webkit-appearance:none;appearance:none;
  width:76px;height:3px;border-radius:2px;
  background:linear-gradient(to right, #fff var(--vol,80%), rgba(255,255,255,.28) var(--vol,80%));
  cursor:pointer;outline:none;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:12px;height:12px;border-radius:50%;
  background:#fff;border:none;
  transition:transform .15s;
}
.vol-slider::-webkit-slider-thumb:hover{transform:scale(1.25)}
.vol-slider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:none}
body.muted .vol-slider{opacity:.35}
/* ---------- liner notes ---------- */
.notes{
  width:clamp(290px,32vw,462px);
  height:min(74vh,660px);   /* 頁框固定：翻頁時框不動、只換墨 */
  overflow-y:auto;overscroll-behavior:contain;
  user-select:text;
  scrollbar-width:thin;scrollbar-color:rgba(var(--ink),.28) transparent;
  padding-right:14px;
}
.notes.has-more{   /* 下面還有：讓最後一行淡出，而不是被硬切 */
  -webkit-mask-image:linear-gradient(180deg,#000 86%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 86%,transparent 100%);
}
.notes::-webkit-scrollbar{width:3px}
.notes::-webkit-scrollbar-thumb{background:rgba(var(--ink),.28);border-radius:2px}
.notes::-webkit-scrollbar-track{background:transparent}
.notes-inner{display:flex;flex-direction:column;gap:24px}
.notes-index{
  display:flex;align-items:center;gap:12px;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:11px;letter-spacing:.16em;
  font-variant-numeric:tabular-nums;
  color:rgba(var(--ink),.72);
}
.notes-index .rule{flex:1;height:1px;background:rgba(var(--ink),.24)}
.notes-hook{
  font-size:19.5px;font-weight:500;line-height:1.58;
  letter-spacing:.005em;
  color:rgb(var(--ink));
  text-wrap:balance;
}
/* 標籤懸在左側版邊，正文自己一欄——印刷品的邊註，不是面板的通欄標題 */
.notes-block{display:grid;grid-template-columns:4.4em 1fr;column-gap:14px;align-items:baseline}
.notes-label{
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:10.5px;font-weight:400;letter-spacing:.12em;line-height:2.7;
  color:rgba(var(--ink),.72);
  text-align:right;
}
.notes-body{
  font-size:14.5px;line-height:1.95;
  color:rgba(var(--ink),.86);
  letter-spacing:.012em;
  text-spacing-trim:trim-start;
  text-wrap:pretty;
}
.credits{
  display:grid;grid-template-columns:4.4em 1fr;
  gap:5px 14px;
  padding-top:19px;
  border-top:1px solid rgba(var(--ink),.18);
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:11px;line-height:1.72;
}
.credits dt{color:rgba(var(--ink),.72);letter-spacing:.1em;text-align:right}
.credits dd{color:rgba(var(--ink),.82)}
.personal{display:grid;grid-template-columns:4.4em 1fr;column-gap:14px;align-items:baseline}
.personal p{
  font-size:14.5px;line-height:1.95;
  color:rgb(var(--ink));letter-spacing:.012em;
}
.notes-close{display:none}
.notes-toggle{display:none}
.notes-scrim{
  position:fixed;inset:0;z-index:44;
  background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .34s ease;
}
body.notes-open .notes-scrim{opacity:1;pointer-events:auto}
/* one authored moment: the booklet page settling — 方向跟著時間軸走 */
.notes-inner{--turn-from:12px}
.notes-inner.back{--turn-from:-12px}
.notes-inner.turn > *{animation:noteIn .58s cubic-bezier(.22,.85,.28,1) both}
.notes-inner.turn > *:nth-child(2){animation-delay:.05s}
.notes-inner.turn > *:nth-child(3){animation-delay:.1s}
.notes-inner.turn > *:nth-child(4){animation-delay:.15s}
.notes-inner.turn > *:nth-child(5){animation-delay:.2s}
.notes-inner.turn > *:nth-child(6){animation-delay:.25s}
@keyframes noteIn{
  from{opacity:0;transform:translateY(var(--turn-from));filter:blur(4px)}
  to{opacity:1;transform:none;filter:blur(0)}
}
@media (prefers-reduced-motion:reduce){
  .notes-inner.turn > *{animation-duration:.01ms;animation-delay:0ms}
}
/* ---------- dock ---------- */
.dock-wrap{
  position:fixed;left:0;right:0;bottom:44px;
  display:flex;justify-content:center;z-index:30;
}
.dock{
  display:flex;align-items:flex-end;gap:9px;
  padding:9px 14px;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.14);
  border-radius:16px;
  backdrop-filter:blur(12px);
  max-width:94vw;overflow-x:auto;scrollbar-width:none;
}
.dock::-webkit-scrollbar{display:none}
.dock-item{
  position:relative;flex:none;
  width:42px;height:42px;
  cursor:pointer;
  transition:transform .18s cubic-bezier(.3,1.3,.4,1);
  transform-origin:bottom center;
}
.dock-item img{width:100%;height:100%;object-fit:cover;display:block;border-radius:4px}
.dock-item::after{
  content:'';position:absolute;left:50%;bottom:-7px;
  width:4px;height:4px;border-radius:50%;
  background:#fff;transform:translateX(-50%) scale(0);
  transition:transform .2s;
}
.dock-item.current::after{transform:translateX(-50%) scale(1)}
.dock-item .tip{
  position:absolute;bottom:calc(100% + 12px);left:50%;
  transform:translateX(-50%) translateY(4px);
  background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.15);
  color:#fff;font-size:11px;font-weight:600;white-space:nowrap;
  padding:5px 10px;border-radius:8px;
  opacity:0;pointer-events:none;
  transition:opacity .15s, transform .15s;
}
.dock-item:hover .tip{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- footer ---------- */
.release-footer{
  position:fixed;left:0;right:0;bottom:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 28px;z-index:20;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:12px;letter-spacing:.06em;
}
.footer-side{min-width:64px}
.footer-side.right{text-align:right}
.footer-center{opacity:.6;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.75}}
.roll{display:inline-block;transition:transform .3s, opacity .3s}
.roll.out{transform:translateY(-8px);opacity:0}
/* ---------- intro ---------- */
.stage,.dock-wrap,.release-footer,.header{animation:rise .8s cubic-bezier(.2,.8,.3,1) both}
.dock-wrap{animation-delay:.15s}
.release-footer{animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
/* ---------- narrow: notes become a booklet you pull out ---------- */
@media (max-width:900px){
  .stage{grid-template-columns:minmax(0,1fr);justify-content:stretch}
  .notes-toggle{
    display:inline-flex;align-items:center;gap:7px;
    margin-top:2px;padding:7px 15px;
    background:transparent;color:var(--fg);
    border:1px solid rgba(255,255,255,.52);border-radius:99px;
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.14em;cursor:pointer;
  }
  .notes-toggle::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75}
  /* 窄欄放不下邊註，標籤回到正文上方 */
  .notes-block,.personal{grid-template-columns:minmax(0,1fr);row-gap:8px}
  .notes-label{text-align:left;line-height:1.6}
  .credits{grid-template-columns:3.6em 1fr}
  .notes{
    position:fixed;left:0;right:0;bottom:0;z-index:45;
    width:auto;height:auto;max-height:82vh;
    padding:8px clamp(20px,6vw,32px) calc(28px + env(safe-area-inset-bottom));
    background:rgb(var(--sheet));   /* 抽屜也吃當首曲目的顏色，只是壓得更暗 */
    border-top:1px solid rgba(var(--ink),.18);
    border-radius:4px 4px 0 0;
    transform:translateY(101%);
    transition:transform .38s cubic-bezier(.28,.9,.3,1);
  }
  /* .stage 有進場動畫＝自成堆疊脈絡，抽屜的 z-index 只在其內部有效；
     開啟時把整個 stage 抬到 dock(30) 與 footer(20) 之上 */
  /* 抽屜有自己的底色，遮罩會把底色一起淡掉讓背後的 dock 透出來 */
  .notes.has-more{-webkit-mask-image:none;mask-image:none}
  body.notes-open .stage{z-index:50}
  body.notes-open .notes{transform:none}
  .notes-inner{padding-top:14px}
  .notes-index{position:sticky;top:0;z-index:2;
    background:linear-gradient(rgb(var(--sheet)) 72%,transparent);
    padding:10px 0 12px;margin-top:-14px}
  .notes-close{
    display:block;background:transparent;border:none;color:rgba(var(--ink),.75);
    font-family:inherit;font-size:11px;letter-spacing:.14em;cursor:pointer;padding:2px 0 2px 10px;
  }
}
/* ---------- mobile ---------- */
@media (max-width:480px){
  :root{--cover:240px}
  .stage{gap:14px;padding-bottom:118px}
  .header{padding:16px 18px}
  .release-footer{padding:11px 16px;font-size:10px}
  .dock-wrap{bottom:40px}
  .dock{gap:7px}
  .dock-item{width:36px;height:36px}
  body.playing .cd{transform:translate(-64px,-50%)}
  @keyframes spin{to{transform:translate(-64px,-50%) rotate(360deg)}}
  .album-title{font-size:clamp(18px,6vw,24px)}
}
</style>
</head>
<body>

<header class="header">
  <a class="logo" href="#">唱片架<span>RECORD SHELF</span></a>
  <a class="intro-link" href="intro.html">看開場</a>
</header>

<main class="stage">
 <div class="player-col">
  <a class="spotify-button" id="spotifyBtn" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#1DB954"/><path d="M17.6 16.7c-.2.35-.66.46-1 .24-2.76-1.69-6.24-2.07-10.33-1.13-.4.09-.79-.16-.88-.55-.09-.4.16-.79.55-.88 4.48-1.02 8.32-.58 11.42 1.31.35.21.46.67.24 1.01zm1.5-3.35c-.27.44-.84.58-1.28.31-3.16-1.94-7.98-2.5-11.72-1.37-.5.15-1.02-.13-1.17-.62-.15-.5.13-1.02.62-1.17 4.28-1.3 9.58-.67 13.24 1.57.44.27.58.84.31 1.28zm.13-3.49C15.5 7.61 9.35 7.4 5.74 8.5c-.58.18-1.2-.15-1.37-.73-.18-.58.15-1.19.73-1.37 4.15-1.26 11-1.02 15.35 1.56.53.31.7 1 .39 1.52-.31.53-1 .7-1.52.39z" fill="#fff"/></svg>
    <span>Open in Spotify</span>
  </a>

  <div class="cd-case">
    <div class="cd" id="cd"></div>
    <div class="cover-stack" id="coverStack"></div>
  </div>

  <div class="media-data">
    <div class="artist-group">
      <span id="artistName"></span>
      <span class="collab" id="collabName"></span>
    </div>
    <h1 class="album-title" id="albumTitle"></h1>
    <div class="album-meta" id="albumMeta"></div>
  </div>

  <div class="media-player">
    <button class="media-button" id="prevBtn" aria-label="上一張">
      <svg viewBox="0 0 16 16"><path d="M3.3 8 13 1.8v12.4L3.3 8zM2 1.5h1.6v13H2v-13z"/></svg>
    </button>
    <button class="media-button play-toggle" id="playBtn" aria-label="播放 / 暫停">
      <svg class="icon-play" viewBox="0 0 16 16"><path d="M4 1.6 14 8 4 14.4V1.6z"/></svg>
      <svg class="icon-pause" viewBox="0 0 16 16"><path d="M3 1.5h3.4v13H3v-13zm6.6 0H13v13H9.6v-13z"/></svg>
    </button>
    <button class="media-button" id="nextBtn" aria-label="下一張">
      <svg viewBox="0 0 16 16"><path d="M12.7 8 3 1.8v12.4L12.7 8zM14 1.5h-1.6v13H14v-13z"/></svg>
    </button>
    <div class="volume-group">
      <button class="media-button vol-btn" id="volBtn" aria-label="靜音切換">
        <svg class="icon-vol" viewBox="0 0 16 16"><path d="M2 6v4h2.6L8 13V3L4.6 6H2z"/><path d="M10 5.2a3.4 3.4 0 0 1 0 5.6V9.4a2 2 0 0 0 0-2.8V5.2z"/><path d="M10 2.6a5.8 5.8 0 0 1 0 10.8v-1.5a4.4 4.4 0 0 0 0-7.8V2.6z"/></svg>
        <svg class="icon-muted" viewBox="0 0 16 16"><path d="M2 6v4h2.6L8 13V3L4.6 6H2z"/><path d="m10.2 6.1 1 1 1-1 .9.9-1 1 1 1-.9.9-1-1-1 1-.9-.9 1-1-1-1 .9-.9z"/></svg>
      </button>
      <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="80" aria-label="音量">
    </div>
  </div>

  <button class="notes-toggle" id="notesToggle" aria-expanded="false" aria-controls="notes">內頁</button>
 </div>

 <div class="notes-scrim" id="notesScrim"></div>

 <aside class="notes" id="notes" aria-label="唱片內頁" tabindex="0">
  <div class="notes-inner" id="notesInner">
    <div class="notes-index">
      <span id="notesNo"></span>
      <span class="rule"></span>
      <button class="notes-close" id="notesClose" aria-label="關閉內頁">收合</button>
    </div>
    <p class="notes-hook" id="notesHook"></p>
    <section class="notes-block">
      <h2 class="notes-label">創作背景</h2>
      <p class="notes-body" id="notesStory"></p>
    </section>
    <section class="notes-block">
      <h2 class="notes-label">歌曲意義</h2>
      <p class="notes-body" id="notesMeaning"></p>
    </section>
    <dl class="credits" id="notesCredits"></dl>
    <section class="personal" id="notesPersonal" hidden>
      <h2 class="notes-label">我的註記</h2>
      <p id="notesPersonalText"></p>
    </section>
  </div>
 </aside>
</main>

<div class="dock-wrap">
  <nav class="dock" id="dock" aria-label="專輯時間軸"></nav>
</div>

<footer class="release-footer">
  <div class="footer-side"><span class="roll" id="footDate"></span></div>
  <div class="footer-center">&lt;&lt; scroll timeline &gt;&gt;&gt;</div>
  <div class="footer-side right"><span class="roll" id="footYear"></span></div>
</footer>

<script src="site.config.js"></script>
<script src="data.js"></script>
<script>
/* ================= site.config 套用＋空資料防呆 ================= */
document.title = SITE.name + ' — ' + SITE.latin;
document.querySelectorAll('.logo').forEach(l => {
  l.firstChild.textContent = SITE.name;
  const s = l.querySelector('span'); if (s) s.textContent = SITE.latin.toUpperCase();
});
if (!ALBUMS.length) {
  document.body.innerHTML = '<p style="color:#fff;font:500 15px/1.8 system-ui;padding:40vh 24px 0;text-align:center">' +
    'data.js 還是空的。先加一首歌：<br><code>node scripts/add-song.mjs "歌手" "歌名"</code></p>';
  throw new Error('ALBUMS is empty');
}

/* ================= build DOM ================= */
const stack = document.getElementById('coverStack');
const dock = document.getElementById('dock');
ALBUMS.forEach((a, i) => {
  const c = document.createElement('div');
  c.className = 'cover';
  c.innerHTML = `<img src="covers/${a.id}.jpg" alt="${a.title}"><div class="sheen"></div>`;
  stack.appendChild(c);

  const d = document.createElement('button');
  d.className = 'dock-item';
  d.setAttribute('aria-label', a.title);
  d.style.border = 'none';
  d.style.background = 'transparent';
  d.style.padding = '0';
  d.innerHTML = `<img src="covers/${a.id}.jpg" alt=""><span class="tip">${a.title}</span>`;
  d.addEventListener('click', () => go(i));
  dock.appendChild(d);
});
const covers = [...stack.children];
const dockItems = [...dock.children];

/* ================= state ================= */
let idx = 0;
let locked = false;
const audio = new Audio();
audio.preload = 'none';

const $ = id => document.getElementById(id);

function rollSwap(el, text){
  el.classList.add('out');
  setTimeout(() => { el.textContent = text; el.classList.remove('out'); }, 300);
}

// 抽屜底色＝當首曲目的顏色壓暗，保住「隨曲換色」這個既有裝置
const darkTint = hex => {
  const v = parseInt(hex.slice(1), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255].map(c => Math.round(c * .42)).join(',');
};

function renderNotes(dir){
  const a = ALBUMS[idx], n = NOTES[a.id];
  const pad = v => String(v).padStart(2, '0');
  $('notesNo').textContent = 'NO. ' + pad(idx + 1) + ' / ' + pad(ALBUMS.length);

  $('notesHook').textContent = n ? n.hook : '這首還沒有內頁。';
  $('notesStory').textContent = n ? n.story : '';
  $('notesMeaning').textContent = n ? n.meaning : '';
  document.querySelectorAll('.notes-block').forEach((b, i) => {
    b.hidden = !n || !(i === 0 ? n.story : n.meaning);
  });

  const dl = $('notesCredits');
  dl.textContent = '';
  if (n) [['詞曲', n.writers], ['收錄', n.source], ['註', n.note]].forEach(([k, v]) => {
    if (!v) return;
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    dl.append(dt, dd);
  });
  dl.hidden = !dl.childElementCount;

  const mine = n && n.mine && n.mine.trim();
  $('notesPersonal').hidden = !mine;
  if (mine) $('notesPersonalText').textContent = n.mine.trim();

  const inner = $('notesInner');           // 內頁翻頁：唯一一段編排過的動態
  inner.classList.remove('turn');
  inner.classList.toggle('back', dir < 0); // 往新的翻，紙從上面進來
  void inner.offsetWidth;
  inner.classList.add('turn');
  $('notes').scrollTop = 0;
}

function updateNotesFade(){
  const n = $('notes');
  n.classList.toggle('has-more', n.scrollTop + n.clientHeight < n.scrollHeight - 4);
}

function render(dir){ // dir: 1 = 往舊的, -1 = 往新的, 0 = 初始
  const a = ALBUMS[idx];
  document.body.style.backgroundColor = a.bg;
  document.querySelector('.cd').style.setProperty('--hole', a.bg);
  document.body.style.setProperty('--sheet', darkTint(a.bg));

  covers.forEach((c, i) => {
    c.classList.remove('active','leaving-up','leaving-down','entering-up');
    if (i === idx) return;
    c.classList.add(dir >= 0 ? 'leaving-up' : 'leaving-down');
  });
  const inc = covers[idx];
  if (dir < 0) inc.classList.add('entering-up'); // 往新的：從上方進場；往舊的：用預設下方姿勢
  void inc.offsetWidth; // reflow so the transition runs from the offset pose
  inc.classList.remove('entering-up');
  inc.classList.add('active');

  $('artistName').textContent = a.artist;
  $('collabName').textContent = a.collab;
  $('albumTitle').textContent = a.title;
  $('albumMeta').textContent = a.meta + (a.ptrack ? '   ·   ▶ ' + a.ptrack : '');
  $('spotifyBtn').href = 'https://open.spotify.com/search/' + encodeURIComponent(a.q) + '/tracks';
  rollSwap($('footDate'), a.date);
  rollSwap($('footYear'), a.year);
  dockItems.forEach((d, i) => d.classList.toggle('current', i === idx));
  dockItems[idx].scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  renderNotes(dir);

  if (!document.body.classList.contains('playing')) return;
  if (a.preview){ audio.src = a.preview; audio.play().catch(stop); }
  else { audio.pause(); }
}

function go(i, dir){
  if (i === idx || i < 0 || i >= ALBUMS.length) return;
  const d = dir !== undefined ? dir : (i > idx ? 1 : -1);
  idx = i;
  render(d);
}

/* ================= player ================= */
function stop(){
  document.body.classList.remove('playing');
  audio.pause();
}
$('playBtn').addEventListener('click', () => {
  if (document.body.classList.contains('playing')){ stop(); return; }
  document.body.classList.add('playing');
  const a = ALBUMS[idx];
  if (a.preview){ audio.src = a.preview; audio.play().catch(()=>{}); }
});
audio.addEventListener('ended', stop);
$('prevBtn').addEventListener('click', () => go(idx - 1));
$('nextBtn').addEventListener('click', () => go(idx + 1));

/* ================= volume ================= */
const volSlider = $('volSlider');
function setVol(v){ // v: 0-100
  audio.volume = v / 100;
  volSlider.value = v;
  volSlider.style.setProperty('--vol', v + '%');
  document.body.classList.toggle('muted', v === 0 || audio.muted);
  localStorage.setItem('shelf-vol', v);
}
volSlider.addEventListener('input', () => {
  audio.muted = false;
  setVol(+volSlider.value);
});
$('volBtn').addEventListener('click', () => {
  audio.muted = !audio.muted;
  document.body.classList.toggle('muted', audio.muted || +volSlider.value === 0);
});
setVol(+(localStorage.getItem('shelf-vol') ?? 80));

/* ================= 內頁（窄螢幕抽出／收合） ================= */
function openNotes(open){
  document.body.classList.toggle('notes-open', open);
  $('notesToggle').setAttribute('aria-expanded', String(open));
  if (open) $('notes').scrollTop = 0;
}
$('notesToggle').addEventListener('click', () =>
  openNotes(!document.body.classList.contains('notes-open')));
$('notesClose').addEventListener('click', () => openNotes(false));
$('notesScrim').addEventListener('click', () => openNotes(false));
$('notes').addEventListener('scroll', updateNotesFade, {passive:true});
window.addEventListener('resize', updateNotesFade);
// 高度會因換頁、字體載入、視窗縮放而變；翻頁動畫結束才是最終版面
new ResizeObserver(updateNotesFade).observe($('notesInner'));
$('notesInner').addEventListener('animationend', updateNotesFade);
if (document.fonts) document.fonts.ready.then(updateNotesFade);

/* ================= scroll timeline ================= */
function step(dir){
  if (locked) return;
  const t = idx + dir;
  if (t < 0 || t >= ALBUMS.length) return;
  locked = true;
  go(t, dir);
  setTimeout(() => locked = false, 620);
}
const notesEl = $('notes');
window.addEventListener('wheel', e => {
  if (notesEl.contains(e.target)){   // 內頁自己捲得動時，先讓它捲完再換曲
    const room = e.deltaY > 0
      ? notesEl.scrollTop + notesEl.clientHeight < notesEl.scrollHeight - 1
      : notesEl.scrollTop > 1;
    if (room) return;
  }
  if (Math.abs(e.deltaY) < 20) return;
  step(e.deltaY > 0 ? 1 : -1);
}, {passive:true});
window.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ openNotes(false); return; }
  // 焦點在內頁且內頁還捲得動時，方向鍵交還給瀏覽器捲動（否則鍵盤使用者讀不到溢出的部分）
  if (notesEl.contains(document.activeElement) && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){
    const room = e.key === 'ArrowDown'
      ? notesEl.scrollTop + notesEl.clientHeight < notesEl.scrollHeight - 1
      : notesEl.scrollTop > 1;
    if (room) return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') step(-1);
  if (e.key === ' ' && e.target.tagName !== 'BUTTON'){ e.preventDefault(); $('playBtn').click(); }
});
let touchY = null, touchX = null;
window.addEventListener('touchstart', e => {
  if (e.target.closest('.dock') || e.target.closest('.notes')) return;
  if (document.body.classList.contains('notes-open')) return;
  touchY = e.touches[0].clientY; touchX = e.touches[0].clientX;
}, {passive:true});
window.addEventListener('touchend', e => {
  if (touchY === null) return;
  const dy = touchY - e.changedTouches[0].clientY;
  const dx = touchX - e.changedTouches[0].clientX;
  touchY = touchX = null;
  const d = Math.abs(dy) >= Math.abs(dx) ? dy : dx;
  if (Math.abs(d) < 40) return;
  step(d > 0 ? 1 : -1);
}, {passive:true});

/* ================= dock magnification ================= */
const MAG_RANGE = 90, MAG_MAX = .55;
dock.addEventListener('mousemove', e => {
  dockItems.forEach(item => {
    const r = item.getBoundingClientRect();
    const dist = Math.abs(e.clientX - (r.left + r.width / 2));
    const s = dist < MAG_RANGE ? 1 + MAG_MAX * Math.cos((dist / MAG_RANGE) * Math.PI / 2) ** 2 : 1;
    item.style.transform = `scale(${s.toFixed(3)})`;
  });
});
dock.addEventListener('mouseleave', () => {
  dockItems.forEach(item => item.style.transform = '');
});

/* ================= init ================= */
$('footDate').textContent = ALBUMS[0].date;
$('footYear').textContent = ALBUMS[0].year;
render(0);
</script>
</body>
</html>
